# Render free tier blueprint: one web service + one free PostgreSQL database.
# Free-tier limits (check render.com/pricing): the web service sleeps when idle,
# the free database expires after a fixed period, and the disk is ephemeral
# (uploaded photos are lost on redeploy). Fine for a demo; see README for the pilot.
services:
  - type: web
    name: sibuyanconnect
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn sibuyanconnect.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ASSISTANT_LLM_BACKEND
        value: "none"
      - key: DATABASE_URL
        fromDatabase:
          name: sibuyanconnect-db
          property: connectionString

databases:
  - name: sibuyanconnect-db
    plan: free
