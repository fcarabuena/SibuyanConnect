<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true" style="color:var(--pitcher)">*</span>{% endif %}</label>
  {{ field }}
  {% if help %}<span class="help">{{ help }}</span>{% elif field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
